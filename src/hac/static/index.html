<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audiobook Converter</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0l-4 4m4-4l4 4M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></symbol>
  <symbol id="i-library" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20M4 19.5A2.5 2.5 0 006.5 22H20V2H6.5A2.5 2.5 0 004 4.5v15z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12m0 0l-4-4m4 4l4-4M4 17v2a1 1 0 001 1h14a1 1 0 001-1v-2"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a.75.75 0 001.13.65l10.5-6.5a.75.75 0 000-1.3L9.13 4.85A.75.75 0 008 5.5z"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 9v4m0 4h.01M10.3 4.2L2.8 17a2 2 0 001.7 3h15a2 2 0 001.7-3L13.7 4.2a2 2 0 00-3.4 0z"/></symbol>
  <symbol id="i-chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-grip" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></symbol>
  <symbol id="i-arrow-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5m0 0l-6 6m6-6l6 6"/></symbol>
  <symbol id="i-arrow-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14m0 0l6-6m-6 6l-6-6"/></symbol>
  <symbol id="i-music" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13M9 18a3 3 0 11-6 0 3 3 0 016 0zm12-2a3 3 0 11-6 0 3 3 0 016 0z"/></symbol>
</svg>
<header>
  <h1><img src="/static/favicon.svg" class="logo" alt=""> Audiobook Converter</h1>
  <div class="header-actions">
    <span id="health-badge" class="pill" title="加载中…">…</span>
  </div>
</header>

<main class="layout">
  <!-- 1 · FILES (full width working area) -->
  <section class="panel files-panel" id="col-files">
    <div class="panel-head">
      <h2>待转换文件 <span class="small dim" id="file-count"></span></h2>
      <div class="file-tools">
        <div class="dropdown">
          <button id="btn-columns" class="btn small subtle" title="选择表格中显示的元数据栏">列设置</button>
          <div id="columns-pop" class="pop hidden"></div>
        </div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="upload">上传</button>
      <button class="tab" data-tab="library">书库</button>
      <button class="tab" data-tab="uploads">已上传文件</button>
      <span class="small dim sort-hint">拖 ⠿ 调序 · 点列头排序 · 转换/合并按列表顺序（所见即所得）</span>
    </div>

    <div id="pane-upload">
      <div class="add-row">
        <label class="btn small" for="file-input">+ 文件</label>
        <label class="btn small" for="folder-input">+ 文件夹（递归）</label>
        <button id="btn-clear-files" class="btn small subtle">清空列表</button>
        <input type="file" id="file-input" multiple accept="audio/*,.m4b,.opus,.flac,.m4a,.mp3,.aac,.ogg,.wav,.wma" class="hidden">
        <input type="file" id="folder-input" webkitdirectory multiple class="hidden">
        <div id="upload-progress" class="upload-progress" aria-live="polite" aria-label="上传进度"></div>
      <p class="hint">✕ / 清空 只会把文件从当前列表剔除，不删除数据（数据在「已上传文件」里统一管理）</p>
      </div>
      <div class="table-wrap">
        <table class="filetable">
          <thead id="file-head"></thead>
          <tbody id="file-list"></tbody>
        </table>
        <div id="file-empty" class="empty empty-cta">
          <svg class="ic" aria-hidden="true"><use href="#i-upload"/></svg>
          <p>还没有文件 — 拖入音频/文件夹到此处，或从「书库」勾选</p>
          <label class="btn primary empty-cta-btn" for="file-input">添加文件</label>
        </div>
      </div>
    </div>

    <div id="panel-library" class="tabpane hidden">
      <div class="lib-bar">
        <button id="lib-up" class="btn small subtle"><svg class="ic" aria-hidden="true"><use href="#i-arrow-up"/></svg> 上级</button>
        <span id="lib-path" class="small"></span>
      </div>
      <div class="table-wrap lib-wrap">
        <table class="filetable uploadstable">
          <thead id="lib-head"></thead>
          <tbody id="lib-list"></tbody>
        </table>
      </div>
      <p class="hint">书库：<span id="lib-roots"></span></p>
    </div>

    <div id="panel-uploads" class="tabpane hidden">
      <div class="lib-bar">
        <button id="up-del-selected" class="btn small subtle"><svg class="ic" aria-hidden="true"><use href="#i-trash"/></svg> 删除所选</button>
        <button id="up-del-all" class="btn small subtle"><svg class="ic" aria-hidden="true"><use href="#i-trash"/></svg> 删除全部未使用</button>
        <button id="up-add-selected" class="btn small"><svg class="ic" aria-hidden="true"><use href="#i-download"/></svg> 加入列表</button>
        <span class="small dim" id="up-count"></span>
      </div>
      <div class="table-wrap uploads-wrap">
        <table class="filetable">
          <thead id="uploads-head"></thead>
          <tbody id="uploads-list"></tbody>
        </table>
      </div>
      <p class="hint">🔒 = 正被任务使用（只读）。「⤵ 加入列表」把文件放回当前列表，无需重新上传。</p>
    </div>
  </section>

  <aside class="lower">
    <!-- 转换设置（右侧栏） -->
    <section class="panel" id="col-settings">
      <h2>转换设置</h2>
      <label class="field preset-field">预设
        <select id="preset"><option value="">— 自定义 —</option></select>
        <span id="preset-summary" class="preset-summary" hidden></span>
        <span id="preset-hint" class="hint"></span>
      </label>
      <details class="adv" id="adv-box">
        <summary><svg class="ic" aria-hidden="true"><use href="#i-chevron-down"/></svg> 高级参数</summary>
        <div class="adv-body">
      <label class="field">格式 <select id="format"></select></label>
      <label class="field">编码器 <select id="codec"></select>
        <span class="err-hint" id="err-codec"></span></label>
      <label class="field">码率
        <select id="bitrate">
          <option value="">默认</option>
          <option>16k</option><option>24k</option><option>32k</option>
          <option>48k</option><option>64k</option><option>96k</option>
          <option>128k</option><option>192k</option><option>256k</option><option>320k</option>
        </select>
      </label>
      <label class="field">采样率
        <select id="samplerate">
          <option value="">自动</option>
          <option value="24000">24000 Hz</option>
          <option value="44100">44100 Hz</option>
          <option value="48000">48000 Hz</option>
        </select>
      </label>
      <label class="field">声道
        <select id="channels">
          <option value="">保持源</option>
          <option value="1">1 单声道</option>
          <option value="2">2 立体声</option>
        </select>
        <span class="err-hint" id="err-channels"></span>
      </label>
      <label class="field checkbox">
        <input type="checkbox" id="normalize"> 响度归一化 loudnorm（-20 LUFS）
      </label>
        </div>
      </details>

      <fieldset id="merge-box">
        <legend><svg class="ic" aria-hidden="true"><use href="#i-music"/></svg> 合并为一个 M4B（有声书）</legend>
        <label class="field checkbox">
          <input type="checkbox" id="merge-on">
          按列表顺序合并为一个 .m4b（采用以上编码设置，内嵌章节）
        </label>
        <div id="merge-fields" class="hidden">
          <label class="field">书名 <input id="merge-title" placeholder="默认 = 第一个文件标题"></label>
          <label class="field">作者 <input id="merge-artist" placeholder="作者 / 朗读者"></label>
          <label class="field">演播者 <input id="merge-composer" placeholder="可选（写入 ©wrt 演播者标签）"></label>
          <label class="field">封面
          <span class="cover-row">
            <label class="btn small" for="merge-cover">选择封面图片</label>
            <span class="hint" id="cover-name">未选择（可自动提取内嵌封面）</span>
          </span>
          <input type="file" id="merge-cover" accept="image/jpeg,image/png" class="visually-hidden">
        </label>
          <p class="hint" id="merge-hint"></p>
        </div>
      </fieldset>

      <fieldset>
        <legend>元数据（留空 = 继承源文件）</legend>
        <label class="field">标题来源
          <select id="title-source">
            <option value="inherit">继承源文件标题</option>
            <option value="filename">源文件名（不含后缀）</option>
            <option value="pattern">自定义 pattern</option>
          </select>
        </label>
        <label class="field hidden" id="title-pattern-row">标题 pattern
          <input id="title-pattern" placeholder="第${TrackNum:3}集">
          <span class="hint">${TrackNum} = 章节号；${TrackNum:3} 补零。源无 track 时用列表顺序。</span>
        </label>
        <label class="field meta-dup">标题 <input id="meta-title"></label>
        <label class="field meta-dup">作者 <input id="meta-artist"></label>
        <label class="field meta-dup">专辑 <input id="meta-album"></label>
        <label class="field meta-dup">演播者 <input id="meta-composer" placeholder="可选（写入 ©wrt 演播者标签）"></label>
      </fieldset>

      <button id="btn-start" class="btn primary sticky-cta"><svg class="ic" aria-hidden="true"><use href="#i-play"/></svg> 开始转换</button>
    </section>

    <!-- 3 · JOBS -->
    <section class="panel" id="col-jobs">
      <h2>任务</h2>
      <div class="jobbar">
        <button id="btn-zip" class="btn small"><svg class="ic" aria-hidden="true"><use href="#i-download"/></svg> 打包 zip</button>
        <button id="btn-cancel-all" class="btn small subtle"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg> 取消全部</button>
        <button id="btn-clear-finished" class="btn small subtle"><svg class="ic" aria-hidden="true"><use href="#i-trash"/></svg> 清理产物</button>
      </div>
      <ul id="job-list" class="joblist" aria-live="polite"></ul>
    </section>
  </aside>
</main>

<script src="/static/app.js"></script>
</body>
</html>
