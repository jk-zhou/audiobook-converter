[project]
name = "audiobook-converter"
version = "0.2.0"
description = "Web-based batch audio transcoder for audiobooks (Opus/AAC/M4B merge with chapters)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0",
    "mutagen>=1.47",
    "pydantic>=2.6",
    "sqlmodel>=0.0.42",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hac"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
